<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>findparking</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="loading-overlay">
        <div class="loader-content">
            <div class="loader-bar"></div>
            <span class="loader-text">ACQUIRING DATA</span>
        </div>
    </div>

    <header id="site-header">
        <div class="header-left">
            <span class="header-logo">FP://</span>
            <span class="header-title">FINDPARKING</span>
        </div>
        <div class="header-right">
            <select id="city-selector" class="city-selector" aria-label="Select city">
                <option value="waterloo">WATERLOO, ON</option>
                <option value="toronto">TORONTO, ON</option>
                <option value="vancouver">VANCOUVER, BC</option>
            </select>
            <span class="header-status" id="connection-status">OFFLINE</span>
        </div>
    </header>

    <div id="map"></div>

    <div id="bottom-sheet" class="bottom-sheet hidden">
        <div class="sheet-handle" id="sheet-handle">
            <div class="handle-bar"></div>
        </div>
        <div class="sheet-content">
            <div class="sheet-header">
                <span class="sheet-lot-name" id="sheet-lot-name">--</span>
                <button class="sheet-close" id="sheet-close" aria-label="Close">&times;</button>
            </div>

            <div class="sheet-score-row">
                <span class="sheet-score" id="sheet-score">--</span>
                <span class="sheet-score-unit">%</span>
                <span class="sheet-availability-badge" id="sheet-badge">--</span>
            </div>

            <div class="sheet-details">
                <div class="detail-row">
                    <span class="detail-label">TREND</span>
                    <span class="detail-value" id="sheet-trend">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">CAPACITY</span>
                    <span class="detail-value" id="sheet-capacity">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">WALKING</span>
                    <span class="detail-value" id="sheet-walking">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">CONFIDENCE</span>
                    <span class="detail-value" id="sheet-confidence">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">UPDATED</span>
                    <span class="detail-value" id="sheet-updated">--</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <script src="/js/parking_api.js"></script>
    <script src="/js/map.js"></script>
    <script src="/js/bottom_sheet.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
