<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>findparking</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="loading-overlay">
        <div class="loader-content">
            <div class="loader-bar"></div>
            <span class="loader-text">ACQUIRING DATA</span>
        </div>
    </div>

    <header id="site-header">
        <div class="header-left">
            <span class="header-logo">FP://</span>
            <span class="header-title">FINDPARKING</span>
        </div>
        <div class="search-container">
            <input type="text" id="search-input" class="search-input" placeholder="Search address..." autocomplete="off" />
            <button id="geolocate-btn" class="geolocate-btn" aria-label="Use my location" title="Use my location">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="4"/>
                    <line x1="12" y1="2" x2="12" y2="6"/>
                    <line x1="12" y1="18" x2="12" y2="22"/>
                    <line x1="2" y1="12" x2="6" y2="12"/>
                    <line x1="18" y1="12" x2="22" y2="12"/>
                </svg>
            </button>
            <div id="search-results" class="search-results"></div>
        </div>
        <div class="header-right">
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" title="Toggle light/dark mode">
                <svg id="theme-icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>
                </svg>
                <svg id="theme-icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                    <circle cx="12" cy="12" r="5"/>
                    <line x1="12" y1="1" x2="12" y2="3"/>
                    <line x1="12" y1="21" x2="12" y2="23"/>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                    <line x1="1" y1="12" x2="3" y2="12"/>
                    <line x1="21" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
            </button>
            <button id="filter-toggle" class="filter-toggle" aria-label="Toggle filters" title="Filters">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="4" y1="6" x2="20" y2="6"/>
                    <line x1="6" y1="12" x2="18" y2="12"/>
                    <line x1="8" y1="18" x2="16" y2="18"/>
                </svg>
            </button>
            <select id="city-selector" class="city-selector" aria-label="Select city">
                <option value="waterloo">WATERLOO, ON</option>
                <option value="toronto">TORONTO, ON</option>
                <option value="vancouver">VANCOUVER, BC</option>
            </select>
            <span class="header-status" id="connection-status">OFFLINE</span>
        </div>
    </header>

    <div id="filter-panel" class="filter-panel">
        <div class="filter-group">
            <label class="filter-label" for="filter-radius">RADIUS</label>
            <input type="range" id="filter-radius" class="filter-slider" min="0.5" max="5.0" step="0.5" value="2.0" />
            <span class="filter-range-label" id="filter-radius-label">2.0 km / ~24 min walk</span>
        </div>
        <div class="filter-group">
            <label class="filter-label" for="filter-fare-type">FARE TYPE</label>
            <select id="filter-fare-type" class="filter-select">
                <option value="">All</option>
                <option value="free">Free</option>
                <option value="hourly">Hourly</option>
                <option value="daily">Daily</option>
                <option value="flat">Flat</option>
            </select>
        </div>
        <div class="filter-group">
            <label class="filter-label" for="filter-max-rate">MAX RATE ($/hr)</label>
            <input type="number" id="filter-max-rate" class="filter-number-input" min="0" step="0.5" placeholder="--" />
        </div>
        <div class="filter-group filter-toggles">
            <label class="filter-toggle-label">
                <input type="checkbox" id="filter-covered" />
                <span class="toggle-text">COVERED</span>
            </label>
            <label class="filter-toggle-label">
                <input type="checkbox" id="filter-multi-level" />
                <span class="toggle-text">MULTI-LEVEL</span>
            </label>
            <label class="filter-toggle-label">
                <input type="checkbox" id="filter-above-ground" />
                <span class="toggle-text">ABOVE GROUND</span>
            </label>
        </div>
        <div class="filter-group">
            <label class="filter-label" for="filter-min-confidence">MIN CONFIDENCE</label>
            <input type="range" id="filter-min-confidence" class="filter-slider" min="0" max="1" step="0.05" value="0" />
            <span class="filter-range-label" id="filter-min-confidence-label">0%</span>
        </div>
        <div class="filter-group">
            <label class="filter-label" for="filter-min-probability">MIN PROBABILITY</label>
            <input type="range" id="filter-min-probability" class="filter-slider" min="0" max="1" step="0.05" value="0" />
            <span class="filter-range-label" id="filter-min-probability-label">0%</span>
        </div>
        <button id="filter-reset" class="filter-reset-btn">RESET</button>
    </div>

    <div id="map"></div>

    <div id="bottom-sheet" class="bottom-sheet hidden">
        <div class="sheet-handle" id="sheet-handle">
            <div class="handle-bar"></div>
        </div>
        <div class="sheet-content">
            <div class="sheet-header">
                <span class="sheet-lot-name" id="sheet-lot-name">--</span>
                <button class="sheet-close" id="sheet-close" aria-label="Close">&times;</button>
            </div>

            <div class="sheet-score-row">
                <span class="sheet-score" id="sheet-score">--</span>
                <span class="sheet-score-unit">%</span>
                <span class="sheet-availability-badge" id="sheet-badge">--</span>
            </div>

            <div class="sheet-details">
                <div class="detail-row">
                    <span class="detail-label">TREND</span>
                    <span class="detail-value" id="sheet-trend">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">CAPACITY</span>
                    <span class="detail-value" id="sheet-capacity">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">WALKING</span>
                    <span class="detail-value" id="sheet-walking">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">FARE</span>
                    <span class="detail-value" id="sheet-fare">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">TYPE</span>
                    <span class="detail-value" id="sheet-lot-type">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">PREDICTED</span>
                    <span class="detail-value" id="sheet-predicted">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">CONFIDENCE</span>
                    <span class="detail-value" id="sheet-confidence">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">SIGNALS</span>
                    <span class="detail-value" id="sheet-signals">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">UPDATED</span>
                    <span class="detail-value" id="sheet-updated">--</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <script src="/js/parking_api.js"></script>
    <script src="/js/map.js"></script>
    <script src="/js/bottom_sheet.js"></script>
    <script src="/js/search.js"></script>
    <script src="/js/filters.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
